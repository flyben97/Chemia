name: chemia
channels:
  - conda-forge
  - pytorch
  - pyg
  - defaults

dependencies:
  # Python - Specify version range
  - python>=3.8,<3.13

  # Core scientific computing
  - numpy>=1.21.0,<2.0
  - pandas>=1.3.0,<3.0
  - scipy>=1.7.0,<2.0

  # Machine learning core
  - scikit-learn>=1.0.2,<2.0

  # System dependencies
  - typing_extensions>=4.0.0
  - packaging>=21.0

  # Chemical informatics (install via conda for better compatibility)
  - rdkit>=2022.03.1

  # Data processing
  - pyyaml>=6.0,<7.0
  - joblib>=1.1.0,<2.0
  - tqdm>=4.62.0,<5.0

  # Visualization (conda versions for better integration)
  - matplotlib>=3.5.0,<4.0
  - seaborn>=0.11.0,<1.0

  # Development tools (optional)
  - jupyter>=1.0.0
  - jupyterlab>=3.0.0,<5.0

  # PyTorch (CPU version by default)
  # For GPU support, use: pytorch::pytorch::*=*cuda* instead
  - pytorch::pytorch>=1.11.0
  - pytorch::torchvision>=0.12.0
  - pytorch::torchaudio>=0.11.0

  # Pip dependencies
  - pip>=21.0
  - pip:
    # Machine Learning - Gradient Boosting
    - xgboost>=1.6.0,<4.0
    - lightgbm>=3.3.0,<5.0
    - catboost>=1.0.4,<2.0
    
    # PyTorch TabNet - Neural Network for tabular data
    - pytorch-tabnet>=4.0.0,<5.0
    
    # Hyperparameter optimization
    - optuna>=3.0.0,<5.0
    
    # Enhanced UI
    - rich>=12.0.0,<14.0
    
    # Additional visualization
    - plotly>=5.0.0,<6.0
    
    # Web UI (optional)
    - streamlit>=1.28.0,<2.0
    
    # Development tools (optional)
    - pytest>=7.0.0,<9.0
    - pytest-cov>=3.0.0,<5.0
    - flake8>=4.0.0,<8.0
    - black>=22.0.0,<25.0

# Environment variables for performance optimization
variables:
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"
  NUMBA_NUM_THREADS: "4" 